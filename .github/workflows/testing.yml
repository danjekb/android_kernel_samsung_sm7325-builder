name: Testing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.ts.outputs.TIME }}
      date: ${{ steps.ts.outputs.DATE }}
    strategy:
      matrix:
        build-type: [a52sxq, a73xq, m52xq]

    steps:
      - uses: actions/checkout@v6

      - name: Timestamp
        id: ts
        run: |
          DATE=$(date +'%Y%m%d')
          TIME=$(date +'%s')
          echo "DATE=$DATE" >> $GITHUB_OUTPUT
          echo "TIME=$TIME" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential bison flex zip p7zip-full \
            libc6 curl libstdc++6 git wget libssl-dev zstd \
            lld python3

      - name: Preparing kernel sources
        run: |
          if [ -d "$PWD/android_kernel_samsung_sm7325" ]; then
            rm -rf android_kernel_samsung_sm7325
          fi
          echo "Cloning kernel sources..."
          if [[ "${{ matrix.build-type }}" == "a52sxq" ]]; then
            git clone https://github.com/LineageOS/android_kernel_samsung_sm7325 --depth=1 -b lineage-23.2
          elif [[ "${{ matrix.build-type }}" == "a73xq" ]]; then
            git clone https://github.com/LineageOS/android_kernel_samsung_sm7325 --depth=1 -b lineage-23.2
          elif [[ "${{ matrix.build-type }}" == "m52xq" ]]; then
            git clone https://github.com/LineageOS/android_kernel_samsung_sm7325 --depth=1 -b lineage-23.2
          fi
          echo "Copying buildscript..."
          cp build.sh android_kernel_samsung_sm7325/
          chmod +x ./android_kernel_samsung_sm7325/build.sh

      - name: Compile the kernel
        run: |
          cd android_kernel_samsung_sm7325/
          echo "Starting to compile..."
          if [[ "${{ matrix.build-type }}" == "a52sxq" ]]; then
            ./build.sh /lineage-a52sxq_defconfig --ksu=KSU_BLXX
          elif [[ "${{ matrix.build-type }}" == "a73xq" ]]; then
            ./build.sh /lineage-a73xq_defconfig --ksu=KSU_BLXX
          elif [[ "${{ matrix.build-type }}" == "m52xq" ]]; then
            ./build.sh /lineage-m52xq_defconfig --ksu=KSU_BLXX
          fi
          cd ..
          ls -la android_kernel_samsung_sm7325/out/arch/arm64/boot/

      - name: Preparing AnyKernel3 sources
        run: |
          if [ -d "$PWD/AnyKernel3" ]; then
            rm -rf AnyKernel3
          fi
          git clone https://github.com/riarumoda/AnyKernel3 AnyKernel3 --depth=1
          cp android_kernel_samsung_sm7325/out/arch/arm64/boot/Image AnyKernel3/
          if [[ "${{ matrix.build-type }}" == "a52sxq" ]]; then
            sed -i 's/supported.versions=11-16/supported.versions=13-16/' AnyKernel3/anykernel.sh
            sed -i 's/device.name1=sweet/device.name1=a52s/' AnyKernel3/anykernel.sh
            sed -i 's/device.name2=sweetin/device.name2=a52sxq/' AnyKernel3/anykernel.sh
            sed -i 's/sweet (sm6150)/a52s (sm7325)/g' AnyKernel3/banner
          elif [[ "${{ matrix.build-type }}" == "a73xq" ]]; then
            sed -i 's/supported.versions=11-16/supported.versions=13-16/' AnyKernel3/anykernel.sh
            sed -i 's/device.name1=sweet/device.name1=a73/' AnyKernel3/anykernel.sh
            sed -i 's/device.name2=sweetin/device.name2=a73xq/' AnyKernel3/anykernel.sh
            sed -i 's/sweet (sm6150)/a73 (sm7325)/g' AnyKernel3/banner
          elif [[ "${{ matrix.build-type }}" == "m52xq" ]]; then
            sed -i 's/supported.versions=11-16/supported.versions=13-16/' AnyKernel3/anykernel.sh
            sed -i 's/device.name1=sweet/device.name1=m52/' AnyKernel3/anykernel.sh
            sed -i 's/device.name2=sweetin/device.name2=m52xq/' AnyKernel3/anykernel.sh
            sed -i 's/sweet (sm6150)/m52 (sm7325)/g' AnyKernel3/banner
          fi

      - name: Pack & upload artifacts (All builds)
        uses: actions/upload-artifact@v6
        with:
          name: crappy-kernel-${{ matrix.build-type }}-lol-${{ steps.ts.outputs.DATE }}-${{ steps.ts.outputs.TIME }}
          path: |
            AnyKernel3/*
      
      - name: Pack & upload artifacts (output)
        uses: actions/upload-artifact@v6
        with:
          name: output-${{ matrix.build-type }}
          path: |
            android_kernel_samsung_sm7325/out
